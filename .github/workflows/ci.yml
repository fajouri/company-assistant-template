name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-fictional-database-password
      ENTRA_TENANT_ID: 11111111-1111-1111-1111-111111111111
      ENTRA_CLIENT_ID: 33333333-3333-3333-3333-333333333333
      ENTRA_CLIENT_SECRET: ci-fictional-configuration-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet build src/CompanyAssistant.Web -c Release
      - run: dotnet test tests/CompanyAssistant.Web.Tests -c Release --filter "Category!=Database"
      - name: Verify branding logo validation and static assets
        run: python3 tests/branding_logo_test.py
      - name: Build and smoke test containers
        run: |
          docker compose up --build -d --wait
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/health/live; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/health/live
          curl --fail http://localhost:8080/api/branding
          curl --fail http://localhost:8080/ | grep 'id="root"'
          docker compose exec -T db psql -U assistant -d assistant -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"
      - name: Apply and verify database migrations
        run: |
          docker compose exec -T web dotnet CompanyAssistant.Web.dll migrate
          docker compose exec -T db psql -U assistant -d assistant -c "SELECT count(*) AS applied_migrations FROM __schema_migrations;"
          docker compose exec -T db psql -U assistant -d assistant -c "SELECT rolname FROM pg_roles WHERE rolname IN ('assistant_ingest','assistant_runtime') ORDER BY rolname;"
          docker compose exec -T db psql -U assistant -d assistant -c "SELECT to_regclass('public.documents') AS documents, to_regclass('public.document_chunks') AS chunks;"
      - name: Run database integration tests
        env:
          TEST_DATABASE_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=assistant;Username=assistant;Password=ci-fictional-database-password
        run: dotnet test tests/CompanyAssistant.Web.Tests -c Release --no-build --filter "Category=Database"
      - if: always()
        run: docker compose down
