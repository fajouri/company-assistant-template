services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AzureAd__TenantId: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      AzureAd__ClientId: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID in .env}
      AzureAd__ClientSecret: ${ENTRA_CLIENT_SECRET:?Set ENTRA_CLIENT_SECRET in .env}
      DataProtection__KeyPath: /tmp/company-assistant-keys
      Database__RuntimeConnectionString: Host=db;Database=assistant;Username=assistant;Password=${POSTGRES_PASSWORD}
      Database__IngestionConnectionString: Host=db;Database=assistant;Username=assistant;Password=${POSTGRES_PASSWORD}
      Database__MigrationConnectionString: Host=db;Database=assistant;Username=assistant;Password=${POSTGRES_PASSWORD}
      Ingestion__SourcePath: /data/policies
    volumes:
      - ./fixtures/policies:/data/policies:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
